slug: refund-intake
name: Refund intake
version: 1.0.0
description: Collect refund context, inspect policy evidence, and leave the ticket ready for action.
owner: support-ops
trigger:
  type: manual
steps:
  - id: find_policy
    type: search
    query: "refund policy for {{ ticket.subject }}"
    scope: knowledge
    max_hops: 2
    save_as: policy
  - id: add_context_note
    type: add_note
    body: "Refund intake started. Top policy hit: {{ policy.hits.0.title }}"
evals:
  - name: basic_refund_ticket
    input:
      ticket:
        subject: Refund request
    expect:
      status: completed
      steps:
        - find_policy
        - add_context_note
