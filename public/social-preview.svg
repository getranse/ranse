<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ff8a4c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- R mark + wordmark, top row -->
  <g transform="translate(96 112)">
    <rect width="176" height="176" rx="38" fill="#0a0a0b" stroke="#2a2a2d" stroke-width="1"/>
    <text x="88" y="98" text-anchor="middle" dominant-baseline="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="104" font-weight="700" fill="#ff8a4c">R</text>
  </g>
  <text x="304" y="240"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="144" font-weight="700" fill="#f5f5f7" letter-spacing="-4">Ranse</text>

  <!-- Tagline + accent, full-width row below -->
  <text x="96" y="420"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="44" font-weight="500" fill="#d2d2d7">Cloudflare-native support inbox</text>
  <rect x="96" y="454" width="72" height="4" rx="2" fill="#ff8a4c"/>

  <!-- Footer -->
  <text x="96" y="572"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="500" fill="#6e6e73">Open-source · Apache-2.0 · One-click deploy to Cloudflare</text>
</svg>
